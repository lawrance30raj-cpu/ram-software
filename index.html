<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ram Software WebOS</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
        }

        /* Desktop Grid */
        #desktop {
            width: 100%;
            height: calc(100% - 60px);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            grid-auto-rows: 95px;
            gap: 15px;
            align-content: start;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            cursor: pointer;
            border-radius: 12px;
            padding: 8px;
            transition: all 0.2s ease;
        }

        .app-icon:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .app-icon i {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .app-icon span {
            font-size: 11px;
            text-align: center;
            font-weight: 500;
        }

        /* Window Layout */
        .window {
            position: absolute;
            top: 4%;
            left: 3%;
            width: 94%;
            height: 84%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
            animation: winPop 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes winPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .window-header {
            background: rgba(240, 240, 240, 0.85);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .window-title {
            font-size: 14px;
            font-weight: 600;
            color: #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: #ff5f56;
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: #222;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: rgba(245, 245, 245, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.4);
        }

        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .taskbar-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .taskbar-icon:active {
            transform: scale(0.85);
            background: rgba(0, 0, 0, 0.1);
        }

        .taskbar-right {
            position: absolute;
            right: 15px;
            color: #333;
            font-size: 12px;
            font-weight: 600;
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            background: rgba(250, 250, 250, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 16px;
            padding: 20px;
            display: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 101;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .start-search {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
            margin-bottom: 15px;
            font-size: 13px;
        }

        /* App Store UI */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .store-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .store-card i {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .store-card h4 {
            font-size: 13px;
            margin-bottom: 5px;
        }

        .install-btn {
            margin-top: 8px;
            background: #0078d4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .install-btn.installed {
            background: #4CAF50;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        .notepad-area {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div id="desktop" onclick="closeStartMenu()">
        <div class="app-icon" onclick="openApp('App Store', getStoreHTML())">
            <i class="fa-solid fa-bag-shopping" style="color: #ff9800;"></i>
            <span>App Store</span>
        </div>
        <div class="app-icon" onclick="openApp('My Files', getFilesHTML())">
            <i class="fa-solid fa-folder-closed" style="color: #ffd04b;"></i>
            <span>My Files</span>
        </div>
