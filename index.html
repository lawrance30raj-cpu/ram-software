<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ram Software WebOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: linear-gradient(135deg, #1e3c72, #2a5298); height: 100vh; overflow: hidden; position: relative; }
    
    /* Desktop & Grid */
    .desktop { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; padding: 20px; }
    .icon { display: flex; flex-direction: column; align-items: center; color: white; cursor: pointer; text-shadow: 1px 1px 3px black; font-size: 12px; text-align: center; }
    .icon img, .icon-box { width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 5px; }
    
    /* Window UI */
    .window { position: absolute; top: 10%; left: 5%; width: 90%; height: 75%; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); display: none; flex-direction: column; z-index: 10; overflow: hidden; }
    .window-header { background: #333; color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: #ff5f56; border: none; color: white; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-weight: bold; }
    .window-body { flex: 1; padding: 10px; overflow-y: auto; }
    
    /* Browser & Toolbar */
    .browser-bar { display: flex; gap: 5px; margin-bottom: 10px; }
    .browser-bar input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
    .browser-bar button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    iframe { width: 100%; height: calc(100% - 40px); border: none; }

    /* Taskbar */
    .taskbar { position: absolute; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); display: flex; align-items: center; padding: 0 10px; gap: 15px; }
    .start-btn { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Desktop Icons -->
  <div class="desktop" id="desktop">
    <div class="icon" onclick="openWindow('browser-window')">
      <div class="icon-box">🌐</div>
      <span>Google Search</span>
    </div>
    <div class="icon" onclick="openWindow('youtube-window')">
      <div class="icon-box">▶️</div>
      <span>YouTube</span>
    </div>
    <div class="icon" onclick="openWindow('appstore-window')">
      <div class="icon-box">🛍️</div>
      <span>App Store</span>
    </div>
    <div class="icon" onclick="openWindow('notepad-window')">
      <div class="icon-box">📝</div>
      <span>Notepad</span>
    </div>
  </div>

  <!-- Google / Web Browser Window -->
  <div id="browser-window" class="window">
    <div class="window-header">
      <span>Ram Web Browser</span>
      <button class="close-btn" onclick="closeWindow('browser-window')">X</button>
    </div>
    <div class="window-body">
      <div class="browser-bar">
        <input type="text" id="url-input" placeholder="Search Google or enter Website URL...">
        <button onclick="searchWeb()">Go</button>
      </div>
      <iframe id="browser-frame" src="https://www.bing.com"></iframe>
    </div>
  </div>

  <!-- YouTube Window -->
  <div id="youtube-window" class="window">
    <div class="window-header">
      <span>YouTube App</span>
      <button class="close-btn" onclick="closeWindow('youtube-window')">X</button>
    </div>
    <div class="window-body" style="padding:0;">
      <iframe src="https://www.youtube.com/embed" style="width:100%; height:100%;"></iframe>
    </div>
  </div>

  <!-- App Store Window -->
  <div id="appstore-window" class="window">
    <div class="window-header">
      <span>Ram App Store</span>
      <button class="close-btn" onclick="closeWindow('appstore-window')">X</button>
    </div>
    <div class="window-body">
      <h3>Install New Web Apps</h3>
      <p style="margin-bottom:10px; color:#666;">ஏதேனும் வெப்சைட் / ஆப்களின் பெயர் மற்றும் URL உள்ளிட்டு Install செய்யவும்:</p>
      <input type="text" id="app-name" placeholder="App Name (eg: Wikipedia)" style="width:100%; padding:8px; margin-bottom:8px;">
      <input type="text" id="app-url" placeholder="App URL (eg: https://www.wikipedia.org)" style="width:100%; padding:8px; margin-bottom:8px;">
      <button onclick="installApp()" style="padding:8px 15px; background:green; color:white; border:none; border-radius:5px; cursor:pointer;">Install App to Desktop</button>
    </div>
  </div>

  <!-- Notepad Window -->
  <div id="notepad-window" class="window">
    <div class="window-header">
      <span>Notepad</span>
      <button class="close-btn" onclick="closeWindow('notepad-window')">X</button>
    </div>
    <div class="window-body">
      <textarea id="note-data" style="width:100%; height:80%; padding:10px;" placeholder="Type something here..."></textarea>
      <button onclick="saveNote()" style="margin-top:5px; padding:5px 10px;">Save Note</button>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" onclick="alert('Ram WebOS v2.2 Ready!')">Start</button>
  </div>

  <script>
    function openWindow(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }

    // புதுப்பிக்கப்பட்ட தேடல் பங்க்ஷன்
    function searchWeb() {
      let query = document.getElementById('url-input').value.trim();
      let frame = document.getElementById('browser-frame');

      if (!query) return;

      // 1. YouTube வீடியோ லிங்காக இருந்தால் embed லிங்காக மாற்றும்
      if (query.includes('youtube.com/watch?v=')) {
        let videoId = query.split('v=')[1].split('&')[0];
        frame.src = 'https://www.youtube.com/embed/' + videoId;
        return;
      } 

      // 2. URL அமைத்தல்
      let targetUrl = query;
      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        if (query.includes('.') && !query.includes(' ')) {
          targetUrl = 'https://' + query;
        } else {
          targetUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
        }
      }

      // 3. iframe அனுமதி இல்லாத வெப்சைட்களை புதிய Tab-ல் திறக்கும்
      const restrictedSites = ['google.com', 'youtube.com', 'facebook.com', 'instagram.com', 'github.com', 'vscode.dev'];
      let isRestricted = restrictedSites.some(site => targetUrl.toLowerCase().includes(site));

      if (isRestricted && !targetUrl.includes('embed')) {
        alert('பாதுகாப்பு காரணங்களால் இந்த தளம் புதிய Tab-ல் திறக்கப்படுகிறது!');
        window.open(targetUrl, '_blank');
      } else {
        frame.src = targetUrl;
      }
    }

    function installApp() {
      let name = document.getElementById('app-name').value;
      let url = document.getElementById('app-url').value;
      if (!name || !url) { alert('விபரங்களை சரியாக உள்ளிடவும்'); return; }

      let desktop = document.getElementById('desktop');
      let newIcon = document.createElement('div');
      newIcon.className = 'icon';
      newIcon.innerHTML = `<div class="icon-box">📌</div><span>${name}</span>`;
      newIcon.onclick = function() {
        document.getElementById('url-input').value = url;
        searchWeb();
        openWindow('browser-window');
      };
      desktop.appendChild(newIcon);
      alert(name + ' Desktop-ல் சேர்க்கப்பட்டது!');
      closeWindow('appstore-window');
    }

    function saveNote() {
      localStorage.setItem('user_note', document.getElementById('note-data').value);
      alert('குறிப்பு சேமிக்கப்பட்டது!');
    }

    window.onload = function() {
      if(localStorage.getItem('user_note')) {
        document.getElementById('note-data').value = localStorage.getItem('user_note');
      }
    }
  </script>
</body>
</html>
