<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ram Software WebOS</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
        }

        /* Desktop Grid */
        #desktop {
            width: 100%;
            height: calc(100% - 60px);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            grid-auto-rows: 95px;
            gap: 15px;
            align-content: start;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            cursor: pointer;
            border-radius: 12px;
            padding: 8px;
            transition: all 0.2s ease;
        }

        .app-icon:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .app-icon i {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .app-icon span {
            font-size: 11px;
            text-align: center;
            font-weight: 500;
        }

        /* Window Layout */
        .window {
            position: absolute;
            top: 4%;
            left: 3%;
            width: 94%;
            height: 84%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
            animation: winPop 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes winPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .window-header {
            background: rgba(240, 240, 240, 0.85);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .window-title {
            font-size: 14px;
            font-weight: 600;
            color: #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: #ff5f56;
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: #222;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: rgba(245, 245, 245, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.4);
        }

        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .taskbar-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .taskbar-icon:active {
            transform: scale(0.85);
            background: rgba(0, 0, 0, 0.1);
        }

        .taskbar-right {
            position: absolute;
            right: 15px;
            color: #333;
            font-size: 12px;
            font-weight: 600;
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            background: rgba(250, 250, 250, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 16px;
            padding: 20px;
            display: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 101;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .start-search {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
            margin-bottom: 15px;
            font-size: 13px;
        }

        /* App Store UI */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .store-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .store-card i {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .store-card h4 {
            font-size: 13px;
            margin-bottom: 5px;
        }

        .install-btn {
            margin-top: 8px;
            background: #0078d4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .install-btn.installed {
            background: #4CAF50;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        .notepad-area {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div id="desktop" onclick="closeStartMenu()">
        <div class="app-icon" onclick="openApp('App Store', getStoreHTML())">
            <i class="fa-solid fa-bag-shopping" style="color: #ff9800;"></i>
            <span>App Store</span>
        </div>
        <div class="app-icon" onclick="openApp('My Files', getFilesHTML())">
            <i class="fa-solid fa-folder-closed" style="color: #ffd04b;"></i>
            <span>My Files</span>
        </div>
        <div class="app-icon" id="app-notepad" onclick="openApp('Notepad', '<textarea class=\'notepad-area\' placeholder=\'Type your notes here...\'></textarea>')">
            <i class="fa-solid fa-file-lines" style="color: #4CAF50;"></i>
            <span>Notepad</span>
        </div>
    </div>

    <!-- Active Window -->
    <div class="window" id="appWindow">
        <div class="window-header">
            <span class="window-title" id="windowTitle"><i class="fa-solid fa-window-maximize"></i> App</span>
            <button class="close-btn" onclick="closeApp()">✕</button>
        </div>
        <div class="window-body" id="windowContent">
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <input type="text" class="start-search" placeholder="Search apps...">
        <div style="display:flex; gap:15px; justify-content:center;">
            <div class="app-icon" style="color:#333;" onclick="openApp('App Store', getStoreHTML())">
                <i class="fa-solid fa-bag-shopping" style="color: #ff9800;"></i>
                <span>App Store</span>
            </div>
            <div class="app-icon" style="color:#333;" onclick="openApp('My Files', getFilesHTML())">
                <i class="fa-solid fa-folder" style="color: #ffd04b;"></i>
                <span>Files</span>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-center">
            <div class="taskbar-icon" style="color:#0078d4;" onclick="toggleStartMenu(event)">
                <i class="fa-brands fa-windows"></i>
            </div>
            <div class="taskbar-icon" onclick="openApp('App Store', getStoreHTML())">
                <i class="fa-solid fa-bag-shopping" style="color: #ff9800;"></i>
            </div>
            <div class="taskbar-icon" onclick="openApp('My Files', getFilesHTML())">
                <i class="fa-solid fa-folder" style="color: #ffd04b;"></i>
            </div>
        </div>
        <div class="taskbar-right" id="clock">
            12:00 PM
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerHTML = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleStartMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('start-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function closeStartMenu() {
            document.getElementById('start-menu').style.display = 'none';
        }

        function openApp(title, content) {
            document.getElementById('windowTitle').innerHTML = title;
            document.getElementById('windowContent').innerHTML = content;
            document.getElementById('appWindow').style.display = 'flex';
            closeStartMenu();
        }

        function closeApp() {
            document.getElementById('appWindow').style.display = 'none';
            document.getElementById('windowContent').innerHTML = '';
        }

        const installedApps = {};

        function installApp(appName, iconClass, iconColor, contentFunc) {
            if (installedApps[appName]) return;

            installedApps[appName] = true;

            const desktop = document.getElementById('desktop');
            const iconDiv = document.createElement('div');
            iconDiv.className = 'app-icon';
            iconDiv.id = 'app-' + appName.toLowerCase().replace(/\s+/g, '');
            iconDiv.onclick = function() { openApp(appName, contentFunc()); };
            iconDiv.innerHTML = `<i class="${iconClass}" style="color: ${iconColor};"></i><span>${appName}</span>`;
            
            desktop.appendChild(iconDiv);

            const btn = document.getElementById('btn-' + appName.toLowerCase().replace(/\s+/g, ''));
            if(btn) {
                btn.innerText = 'Installed';
                btn.classList.add('installed');
            }
        }

        function getStoreHTML() {
            return `
                <h3>🛍️ Ram App Store</h3>
                <p style="font-size:12px; color:#666; margin-bottom:15px;">Install apps to your desktop:</p>
                <div class="store-grid">
                    <div class="store-card">
                        <i class="fa-brands fa-youtube" style="color:#ff0000;"></i>
                        <h4>YouTube</h4>
                        <button class="install-btn ${installedApps['YouTube'] ? 'installed' : ''}" id="btn-youtube" onclick="installApp('YouTube', 'fa-brands fa-youtube', '#ff0000', function(){ return '<iframe src=\'https://www.youtube.com/embed/dQw4w9WgXcQ\' allowfullscreen></iframe>'; })">${installedApps['YouTube'] ? 'Installed' : 'Install'}</button>
                    </div>
                    <div class="store-card">
                        <i class="fa-solid fa-calculator" style="color:#9c27b0;"></i>
                        <h4>Calculator</h4>
                        <button class="install-btn ${installedApps['Calculator'] ? 'installed' : ''}" id="btn-calculator" onclick="installApp('Calculator', 'fa-solid fa-calculator', '#9c27b0', getCalcHTML)">${installedApps['Calculator'] ? 'Installed' : 'Install'}</button>
                    </div>
                    <div class="store-card">
                        <i class="fa-solid fa-film" style="color:#e91e63;"></i>
                        <h4>Movies</h4>
                        <button class="install-btn ${installedApps['Movies'] ? 'installed' : ''}" id="btn-movies" onclick="installApp('Movies', 'fa-solid fa-film', '#e91e63', getMoviesHTML)">${installedApps['Movies'] ? 'Installed' : 'Install'}</button>
                    </div>
                </div>
            `;
        }

        function getFilesHTML() {
            return `
                <div style="padding:10px;">
                    <h3>📁 My Storage</h3>
                    <hr style="margin:10px 0; border:none; border-top:1px solid #ccc;">
                    <div style="display:flex; gap:20px; margin-top:15px;">
                        <div style="text-align:center;">
                            <i class="fa-solid fa-folder" style="font-size:40px; color:#ffd04b;"></i>
                            <p style="font-size:12px; margin-top:5px;">Documents</p>
                        </div>
                        <div style="text-align:center;">
                            <i class="fa-solid fa-file-image" style="font-size:40px; color:#4CAF50;"></i>
                            <p style="font-size:12px; margin-top:5px;">Pictures</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function getMoviesHTML() {
            return `
                <div style="height:100%; display:flex; flex-direction:column; gap:10px;">
                    <h3>🎬 Video Player</h3>
                    <video controls poster="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=800">
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    </video>
                </div>
            `;
        }

        function getCalcHTML() {
            return `
                <div style="display:flex; flex-direction:column; gap:10px; padding:10px;">
                    <input type="text" id="calcInput" style="padding:10px; font-size:18px; text-align:right;" placeholder="0" readonly>
                    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value+='1'">1</button>
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value+='2'">2</button>
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value+='3'">3</button>
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value+='+'">+</button>
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value=''">C</button>
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value+='0'">0</button>
                        <button style="padding:12px;" onclick="try{document.getElementById('calcInput').value=eval(document.getElementById('calcInput').value)}catch(e){}">=</button>
                        <button style="padding:12px;" onclick="document.getElementById('calcInput').value+='*'">*</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
  </html>
